# ===================================================================
# SMART SALON - SPRING BOOT APPLICATION CONFIGURATION
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=smart-salon-backend

# Default Database: H2 Embedded (In-Memory or File-based with Auto-DDL)
spring.datasource.url=jdbc:h2:mem:smartsalondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# POSTGRESQL PRODUCTION CONFIGURATION (Uncomment to use PostgreSQL)
# ===================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/smartsalondb
# spring.datasource.username=postgres
# spring.datasource.password=your_postgres_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# RAZORPAY INTEGRATION (10% Advance Deposit System)
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_smart_salon_demo}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret_key}
salon.advance.percentage=10

# ===================================================================
# GOOGLE GEMINI AI CONFIGURATION
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.7-flash

# CORS Allowed Origins
cors.allowed.origins=http://localhost:3000,http://localhost:5173,https://ais-dev-hdtprmn4q5cw4xgx46ejkd-861596891225.asia-southeast1.run.app,https://ais-pre-hdtprmn4q5cw4xgx46ejkd-861596891225.asia-southeast1.run.app
