# ===================================================================
# SMART SALON - SPRING BOOT APPLICATION CONFIGURATION
# Primary Database: MySQL Relational Database (Production Ready)
# ===================================================================

# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=smart-salon-backend

# ===================================================================
# MYSQL RELATIONAL DATABASE CONFIGURATION (Default for Production)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_salon_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Web Console in Production (Security Best Practice)
spring.h2.console.enabled=false

# ===================================================================
# RAZORPAY INTEGRATION (10% Advance Deposit System)
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_smart_salon_demo}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret_key}
salon.advance.percentage=10

# ===================================================================
# GOOGLE GEMINI AI CONFIGURATION
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash

# CORS Allowed Origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ais-dev-hdtprmn4q5cw4xgx46ejkd-861596891225.asia-southeast1.run.app,https://ais-pre-hdtprmn4q5cw4xgx46ejkd-861596891225.asia-southeast1.run.app}
