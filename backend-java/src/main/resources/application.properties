# ===================================================================
# SMART SALON - SPRING BOOT APPLICATION CONFIGURATION
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=smart-salon-backend

# ===================================================================
# MYSQL 8 — primary persistence (smart_salon_db)
# Override credentials with MYSQL_USER / MYSQL_PASSWORD env vars.
# Create the schema first: mysql -u root -p < schema.sql
# If an older VARCHAR-id appointments table exists, drop it before first boot
# because Hibernate ddl-auto=update cannot change primary-key types.
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_salon_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:VaishuSalunke@9890}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# H2 (local fallback only — keep commented while using MySQL)
# ===================================================================
# spring.datasource.url=jdbc:h2:mem:smartsalondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
