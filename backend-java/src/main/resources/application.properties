# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===================================================================
# SALON BOOKING CAPACITY
# ===================================================================
salon.chairs.capacity=3
salon.time-slots=09:30 AM,10:30 AM,11:45 AM,01:30 PM,02:45 PM,04:00 PM,05:30 PM,06:45 PM,07:30 PM,08:15 PM
salon.advance.percentage=10

# ===================================================================
# RAZORPAY INTEGRATION (10% Advance Deposit System)
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_smart_salon_demo}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret_key}

# ===================================================================
# GOOGLE GEMINI AI CONFIGURATION
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.7-flash

# CORS Allowed Origins
